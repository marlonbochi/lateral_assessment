name: cms-content-sync

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: cms-content-sync:dev
  # No env_file on purpose: Laravel reads the bind-mounted .env / .env.testing
  # itself. Exporting .env as real environment variables would override
  # .env.testing and point the test suite at the development database.
  volumes:
    - .:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cms_sync}
      POSTGRES_USER: ${DB_USERNAME:-cms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${DB_FORWARD_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    <<: *php

  worker:
    <<: *php
    # cms:work reads the queue connection and name from config/cms.php (the
    # same values the webhook uses) and refuses to start on a queue that cannot
    # share the inbox transaction. --sleep=1: an idle worker polls the (indexed)
    # jobs table every second, so a batch is picked up ~1 s after it is acknowledged.
    command: ["php", "artisan", "cms:work", "--sleep=1", "--max-time=3600"]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres-data:
