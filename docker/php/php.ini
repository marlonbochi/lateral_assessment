expose_php = Off

; Hardening for CVE-2026-109618 / CVE-2026-109619 (php2shell) and similar bugs in
; PHP's request parsing. The API only reads JSON from php://input, so PHP never
; needs to parse form or multipart bodies, accept uploads, or track their progress.
enable_post_data_reading = Off
file_uploads = Off
session.upload_progress.enabled = Off
memory_limit = 256M
post_max_size = 2M
max_execution_time = 30
date.timezone = UTC
display_errors = Off
log_errors = On
zend.exception_ignore_args = On
error_log = /proc/self/fd/2
