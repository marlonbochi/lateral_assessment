server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;

    # Resolve "app" through Docker's DNS at request time, so recreating the app
    # container (new IP) does not leave nginx pointing at a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    # The application enforces the 1 MiB webhook limit itself so that the 413
    # is rendered as application/problem+json; nginx only stops abuse above 2 MiB.
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
