# Keeps pinned versions current: the PHP base image is pinned to an exact patch
# release (see App\Support\Security\PhpRuntimePolicy), so new security patches
# arrive as pull requests that CI then checks.
version: 2
updates:
  - package-ecosystem: docker
    directory: /docker/php
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
