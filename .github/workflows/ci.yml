name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Composer, Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit
      - run: vendor/bin/pint --test

  static-analysis:
    name: Static analysis (Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: cms_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d cms_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql, intl, pcntl
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP security baseline
        run: php artisan security:php
      - run: php artisan migrate --env=testing --force
      - name: Test suite
        run: vendor/bin/pest --parallel --coverage --min=85
      - name: Performance tests (20k rows)
        if: ${{ hashFiles('tests/Performance/**') != '' }}
        env:
          PERF_SEED_ROWS: '20000'
        run: |
          php artisan migrate:fresh --env=testing --force
          vendor/bin/pest tests/Performance

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so every commit is scanned, not only the last one.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @redocly/cli@1.34.5 lint specs/001-cms-content-sync/contracts/openapi.yaml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
